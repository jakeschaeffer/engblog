name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ESLint, including the Astro jsx-a11y ruleset (see eslint.config.js).
      - name: Lint
        run: npm run lint

      # astro sync (generates .astro/types.d.ts, which is gitignored and so is
      # absent on a fresh checkout) then tsc --noEmit over src/ and the configs.
      - name: Typecheck
        run: npm run typecheck

      # astro check: Astro-aware diagnostics, component props, content schema.
      - name: Astro check
        run: npm run check

      # vitest run over src/**/*.test.ts.
      - name: Unit tests
        run: npm run test

      # Full static build. This is where strict content-collection schema
      # violations in post frontmatter surface.
      #
      # SITE_URL is set so canonical/OG/RSS/sitemap URLs resolve to a real
      # absolute origin during CI instead of the localhost fallback. It is not
      # the production value — the production origin is configured in Vercel.
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://engineering.ode.com
