  <!--
    Type: the site's own stack. ABC Diatype is named first so a machine that
    licenses it renders the real face; nothing self-hosts it and no CDN is
    loaded, so in practice this rasterises in the sanctioned Helvetica Neue /
    Helvetica / Arial fallback. Weight stays regular — in this identity
    hierarchy comes from size, not from bolding.
  -->
  <text
    x="96"
    y="352"
    font-family="ABC Diatype, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="104"
    font-weight="400"
    letter-spacing="-2"
    fill="#3C2E2A"
  >Engineering</text>

  <!--
    SITE_DESCRIPTION from src/lib/site.ts, verbatim, broken across two lines
    by hand: SVG <text> does not wrap, and the single line is ~1250px wide at
    this size against a 1008px content column.
  -->
  <text
    x="96"
    y="440"
    font-family="ABC Diatype, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="34"
    fill="#625855"
  >Engineering notes, architecture decisions, and build logs</text>
  <text
    x="96"
    y="486"
    font-family="ABC Diatype, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="34"
    fill="#625855"
  >from the team at Ode.</text>

  <rect x="96" y="536" width="120" height="6" fill="#CD3E1D" />
</svg>
