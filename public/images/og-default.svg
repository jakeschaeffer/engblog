<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Engineering — Ode">
  <!--
    SOURCE FILE for the default Open Graph card. Not referenced by the site:
    social crawlers (X, LinkedIn, Slack, Facebook, iMessage) do not render an
    SVG og:image, so `DEFAULT_OG_IMAGE` in src/lib/site.ts points at the PNG
    rendered from this file. Edit this, then regenerate:

      node -e "require('sharp')('public/images/og-default.svg',{density:96}).resize(1200,630).flatten({background:'#FBFBF8'}).png({compressionLevel:9}).toFile('public/images/og-default.png')"

    See docs/images.md. Colours are the Ode palette, lifted from section 1 of
    src/styles/global.css: Bone is the `color-bg` token, Cola is `color-text`,
    Dove is `color-text-muted`, Tomato is `color-accent`. Keep them in sync by
    hand — an SVG in public/ cannot read CSS custom properties. (Token names
    are written without their leading dashes on purpose: a literal double
    hyphen is illegal inside an XML comment and makes this file unparseable.)

    Wording: the lockup already says "Ode", so the type says only
    "Engineering". The company and the publication are named once each, which
    is also why the old "Ode Engineering" string is gone — it was a sub-brand
    nobody blessed.

    Light-only on purpose: OG cards are composited by third parties that do
    not respect prefers-color-scheme.
  -->
  <rect width="1200" height="630" fill="#FBFBF8" />
  <rect x="0" y="0" width="1200" height="10" fill="#CD3E1D" />

  <!--
    The Ode lockup, Figma export verbatim, outlined paths, scaled 0.62 from
    483x97 to 299x60 and set at the 96px margin. Vector in, vector out: it
    rasterises crisp at any density.
  -->
