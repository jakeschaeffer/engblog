<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ode">
  <!--
    Placeholder monogram — TODO(phase-2): replace with the real Ode mark.
    A stroked "O" with a single flat cut on the right edge — restrained, reads
    at 16px, no external references, no embedded fonts.
    Ode brand colours: Bone ground, Cola mark. Light only — the guide sanctions
    no dark theme, so there is no prefers-color-scheme switch here.
  -->
  <style>
    .bg { fill: #fbfbf8; }
    .fg { fill: none; stroke: #3c2e2a; }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <circle class="fg" cx="16" cy="16" r="8" stroke-width="3" />
  <path class="fg" d="M16 8v16" stroke-width="3" stroke-linecap="butt" transform="translate(6 0)" />
</svg>
