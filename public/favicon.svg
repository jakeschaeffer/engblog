<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ode Engineering">
  <!--
    Ode Engineering monogram.
    A stroked "O" with a single flat cut on the right edge — restrained, reads
    at 16px, no external references, no embedded fonts.
    Colours follow the reader's theme via prefers-color-scheme.
  -->
  <style>
    .bg { fill: #fdfdfc; }
    .fg { fill: none; stroke: #17181c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14151a; }
      .fg { stroke: #e9eaee; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <circle class="fg" cx="16" cy="16" r="8" stroke-width="3" />
  <path class="fg" d="M16 8v16" stroke-width="3" stroke-linecap="butt" transform="translate(6 0)" />
</svg>
